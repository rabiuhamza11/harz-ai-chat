<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--border:#2a2a2a;--text:#d4d4d4;--text-dim:#6a6a6a;--accent:#cc785c;--ai-bg:#141414;--green:#00d4a0;--acctxt:#fff}[data-theme="light"]{--bg:#f5f5f7;--surface:#fff;--surface2:#f0f0f5;--border:#e0e0e8;--text:#1a1a2e;--text-dim:#666680;--ai-bg:#f0f0f5}body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}.logo{font-size:24px}.name{font-weight:700;font-size:16px}.title{font-size:11px;color:var(--text-dim)}.spacer{flex:1}.icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:8px;font-size:16px;border-radius:8px}.icon-btn:active{background:var(--surface2)}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.status-dot.red{background:#ff4444}.chat-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.welcome{text-align:center;padding:40px 20px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.welcome .emoji{font-size:50px;margin-bottom:12px}.welcome h2{font-size:22px;margin-bottom:4px}.welcome .sub{font-size:13px;color:var(--accent);margin-bottom:16px}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chip{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}.chip:active{background:var(--accent);color:var(--acctxt)}.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:fadeIn .2s}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.msg.user{align-self:flex-end;background:var(--accent);color:var(--acctxt);border-bottom-right-radius:4px}.msg.ai{align-self:flex-start;background:var(--ai-bg);border:1px solid var(--border);border-bottom-left-radius:4px}.msg-role{font-size:10px;color:var(--text-dim);margin-bottom:3px;font-weight:600}.typing{display:inline-flex;gap:5px;padding:2px 0}.typing span{width:8px;height:8px;border-radius:50%;background:var(--text-dim);animation:bounce 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}.input-area{background:var(--surface);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.input-wrap{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:22px;display:flex;align-items:flex-end;padding:6px 6px 6px 14px}.input-wrap:focus-within{border-color:var(--accent)}#inp{flex:1;background:none;border:none;color:var(--text);font-size:15px;font-family:inherit;resize:none;outline:none;max-height:100px;min-height:22px;padding:4px 0}#inp::placeholder{color:var(--text-dim)}#send{background:var(--accent);color:var(--acctxt);border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}#send:disabled{opacity:.35}.retry-btn{background:var(--accent);color:var(--acctxt);border:none;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;margin-top:6px}.sidebar{position:fixed;top:0;left:0;width:220px;height:100dvh;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .3s;z-index:100;display:flex;flex-direction:column}.sidebar.open{transform:translateX(0)}.sidebar-h{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.sidebar-h h3{color:var(--accent);font-size:15px}.new-chat{background:var(--accent);color:var(--acctxt);border:none;padding:10px 16px;border-radius:10px;font-size:14px;cursor:pointer;margin:12px;font-weight:600}.chat-list{flex:1;overflow-y:auto;padding:0 12px}.chat-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-dim);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-item:active{background:var(--surface2);color:var(--text)}.agents-link{padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim)}.agents-link a{color:var(--accent);text-decoration:none;display:block;padding:4px 0}.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}.overlay.show{opacity:1;pointer-events:auto}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}.file-preview{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px;max-width:260px}

<script>const API="https://superagent-2286fb2f.base44.app/functions/harzChat";const AGENT="hamza";const NAME="Hamza";const SUGGESTIONS=["Code a payment form in HTML","How to integrate Paystack?","Debug my JavaScript code","Create a WhatsApp bot setup"];let recognition=null,isRecording=false,voiceTranscript="";function initVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById("micBtn").style.display="none";document.getElementById("voiceLang").style.display="none";return}recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.onresult=function(e){let it="",ft="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)ft+=t;else it+=t}if(ft)voiceTranscript+=ft+" ";const inp=document.getElementById("inp");inp.value=voiceTranscript+it;inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,100)+"px"};recognition.onerror=function(e){if(e.error==="no-speech")return;if(e.error==="not-allowed")alert("Allow microphone in browser settings");stopVoice()};recognition.onend=function(){if(isRecording){try{recognition.start()}catch(e){}}}}function toggleVoice(){if(!recognition){alert("Browser does not support voice. Use Chrome.");return}if(isRecording)stopVoice();else startVoice()}function startVoice(){recognition.lang=document.getElementById("voiceLang").value||"en-NG";voiceTranscript=document.getElementById("inp").value||"";isRecording=true;document.getElementById("micBtn").classList.add("recording");document.getElementById("micBtn").innerHTML="\u23F9";document.getElementById("recIndicator").classList.add("show");try{recognition.start()}catch(e){}}function stopVoice(){isRecording=false;try{recognition.stop()}catch(e){}document.getElementById("micBtn").classList.remove("recording");document.getElementById("micBtn").innerHTML="\u{1F3A4}";document.getElementById("recIndicator").classList.remove("show")}let msgs=[],busy=false,chats={},cur="default";function init(){try{const s=localStorage.getItem("chat_"+AGENT);if(s)chats=JSON.parse(s)}catch(e){}try{const t=localStorage.getItem("theme_"+AGENT);if(t)document.body.setAttribute("data-theme",t);document.getElementById("tb").innerHTML=t==="light"?"&#9728;":"&#9790;"}catch(e){}if(chats["default"]&&chats["default"].length>0){msgs=chats["default"];render()}else{showWelcome()}renderList()}function save(){try{localStorage.setItem("chat_"+AGENT,JSON.stringify(chats))}catch(e){}}function toggleSb(){document.getElementById("sb").classList.toggle("open");document.getElementById("ov").classList.toggle("show")}function toggleTheme(){const c=document.body.getAttribute("data-theme");const n=c==="dark"?"light":"dark";document.body.setAttribute("data-theme",n);localStorage.setItem("theme_"+AGENT,n);document.getElementById("tb").innerHTML=n==="dark"?"&#9790;":"&#9728;"}function newChat(){const id="c"+Date.now();cur=id;msgs=[];document.getElementById("ca").innerHTML="";showWelcome();document.getElementById("sb").classList.remove("open");document.getElementById("ov").classList.remove("show");renderList();save()}function showWelcome(){document.getElementById("ca").innerHTML='<div class="welcome"><div class="emoji">⚡</div><h2>Hamza</h2><div class="sub">Code & Tech</div><p style="font-size:12px;color:var(--text-dim);margin-bottom:16px">English | Hausa | Pidgin</p><div class="chips">'+SUGGESTIONS.map(s=>'<div class="chip" onclick="suggest(this.textContent)">'+s+'</div>').join("")+'</div></div>'}function renderList(){const l=document.getElementById("cl");l.innerHTML="";Object.keys(chats).reverse().forEach(id=>{if(!chats[id]||chats[id].length===0)return;const d=document.createElement("div");d.className="chat-item";d.textContent=chats[id][0].content.substring(0,28);d.onclick=()=>loadChat(id);l.appendChild(d)})}function loadChat(id){cur=id;msgs=chats[id]||[];render();toggleSb()}function render(){const e=document.getElementById("ca");e.innerHTML="";if(msgs.length===0){showWelcome();return}msgs.forEach(m=>addMsg(m.role,m.content));e.scrollTop=e.scrollHeight}function addMsg(role,content){const w=document.getElementById("wlc");if(w)w.remove();const e=document.getElementById("ca");const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"ai");const r=document.createElement("div");r.className="msg-role";r.textContent=role==="user"?"You":NAME;const c=document.createElement("div");c.textContent=content;d.appendChild(r);d.appendChild(c);e.appendChild(d);e.scrollTop=e.scrollHeight;return d}function suggest(t){document.getElementById("inp").value=t;send()}function ping(){fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"user",content:"ping"}],agent:AGENT,model:"nvidia/nemotron-3-super-120b-a12b:free"}),signal:AbortSignal.timeout(15000)}).then(r=>{document.getElementById("dot").className=r.ok?"status-dot":"status-dot red"}).catch(()=>{document.getElementById("dot").className="status-dot red"})}ping();setInterval(ping,60000);async function send(){const inp=document.getElementById("inp");const text=inp.value.trim();if((!text&&!attachedFile)||busy)return;inp.value="";inp.style.height="auto";busy=true;document.getElementById("send").disabled=true;msgs.push({role:"user",content:text});addMsg("user",text);if(!chats[cur])chats[cur]=[];chats[cur]=msgs;save();renderList();const ca=document.getElementById("ca");const td=document.createElement("div");td.className="msg ai";td.id="ti";td.innerHTML='<div class="msg-role">'+NAME+'</div><div class="typing"><span></span><span></span><span></span></div>';ca.appendChild(td);ca.scrollTop=ca.scrollHeight;try{const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),90000);rmFile();const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({messages:msgs.slice(-10),agent:AGENT},attachedFile&&attachedFileBase64?{file:{name:attachedFile.name,type:attachedFileType,mime:attachedFile.type,data:attachedFileBase64}}:{}),signal:ctrl.signal});clearTimeout(to);document.getElementById("ti")?.remove();if(!res.ok){addMsg("assistant","Server error. Try again.")}else{const data=await res.json();const content=data.content||"No response";msgs.push({role:"assistant",content});addMsg("assistant",content);chats[cur]=msgs;save();renderList()}}catch(e){document.getElementById("ti")?.remove();const ed=addMsg("assistant",e.name==="AbortError"?"Request timed out.":"Network error.");const btn=document.createElement("button");btn.className="retry-btn";btn.textContent="Retry";btn.onclick=()=>{msgs.pop();msgs.pop();ed.remove();document.getElementById("inp").value=text;send()};ed.appendChild(document.createElement("br"));ed.appendChild(btn)}busy=false;document.getElementById("send").disabled=false;document.getElementById("inp").focus()}const inp=document.getElementById("inp");inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,100)+"px"});inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});initVoice();document.getElementById("fileInput").addEventListener("change",handleFile);
init();</script>

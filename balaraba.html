<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><meta name="theme-color" content="#1a0a1a">
<title>Balaraba — Marketing &amp; Content</title>
<style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:#1a0a1a;--surface:#2a0e2a;--surface2:#3a143a;--border:#4a1a4a;--text:#e4c4e4;--text-dim:#8a6a8a;--accent:#e63366;--ai-bg:#2a0e2a;--green:#00d4a0}[data-theme="light"]{--bg:#faf0f5;--surface:#fff;--surface2:#f8e8f0;--border:#dcc0d0;--text:#2a1a2a;--text-dim:#665566;--ai-bg:#f8e8f0}body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}.logo{font-size:24px}.name{font-weight:700;font-size:16px}.title{font-size:11px;color:var(--text-dim)}.spacer{flex:1}.icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:8px;font-size:16px;border-radius:8px}.icon-btn:active{background:var(--surface2)}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.status-dot.red{background:#ff4444}.chat-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.welcome{text-align:center;padding:40px 20px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.welcome .emoji{font-size:50px;margin-bottom:12px}.welcome h2{font-size:22px;margin-bottom:4px}.welcome .sub{font-size:13px;color:var(--accent);margin-bottom:16px}.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chip{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}.chip:active{background:var(--accent);color:#fff}.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:fadeIn .2s}@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}.msg.ai{align-self:flex-start;background:var(--ai-bg);border:1px solid var(--border);border-bottom-left-radius:4px}.msg-role{font-size:10px;color:var(--text-dim);margin-bottom:3px;font-weight:600}.typing{display:inline-flex;gap:5px;padding:2px 0}.typing span{width:8px;height:8px;border-radius:50%;background:var(--text-dim);animation:bounce 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}.input-area{background:var(--surface);border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.input-wrap{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:22px;display:flex;align-items:flex-end;padding:6px 6px 6px 14px}.input-wrap:focus-within{border-color:var(--accent)}#inp{flex:1;background:none;border:none;color:var(--text);font-size:15px;font-family:inherit;resize:none;outline:none;max-height:100px;min-height:22px;padding:4px 0}#inp::placeholder{color:var(--text-dim)}#send{background:var(--accent);color:#fff;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}#send:disabled{opacity:.35}.retry-btn{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;margin-top:6px}.sidebar{position:fixed;top:0;left:0;width:220px;height:100dvh;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .3s;z-index:100;display:flex;flex-direction:column}.sidebar.open{transform:translateX(0)}.sidebar-h{padding:14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.sidebar-h h3{color:var(--accent);font-size:15px}.new-chat{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:14px;cursor:pointer;margin:12px;font-weight:600}.chat-list{flex:1;overflow-y:auto;padding:0 12px}.chat-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-dim);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-item:active{background:var(--surface2);color:var(--text)}.agents-link{padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-dim)}.agents-link a{color:var(--accent);text-decoration:none;display:block;padding:4px 0}.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}.overlay.show{opacity:1;pointer-events:auto}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}</style>
</head>
<body data-theme="dark">
<div class="sidebar" id="sb"><div class="sidebar-h"><h3>Balaraba</h3><button class="icon-btn" onclick="toggleSb()">&times;</button></div><button class="new-chat" onclick="newChat()">+ New Chat</button><div class="chat-list" id="cl"></div><div class="agents-link">HARZ AI Agents:<br><a href="index.html">🤖 HARZ AI</a><a href="sani.html">📚 Sani</a><a href="danladi.html">💰 Danladi</a><a href="zainab.html">🎧 Zainab</a><a href="umar.html">⚡ Umar</a><a href="talle.html">🏪 Talle — Market</a></div></div>
<div class="overlay" id="ov" onclick="toggleSb()"></div>
<div class="header"><button class="icon-btn" onclick="toggleSb()">&#9776;</button><span class="logo">📢</span><div><div class="name">Balaraba</div><div class="title">Marketing &amp; Content</div></div><div class="spacer"></div><button class="icon-btn" onclick="toggleTheme()" id="tb">&#9790;</button><div class="status-dot" id="dot"></div></div>
<div class="chat-area" id="ca"><div class="welcome" id="wlc"></div></div>
<div class="input-area"><div class="input-wrap"><textarea id="inp" placeholder="Ask Balaraba for content..." rows="1"></textarea><button id="send" onclick="send()">&#8593;</button></div></div>
<script>const API="https://superagent-2286fb2f.base44.app/functions/harzChat";const AGENT="balaraba";const NAME="Balaraba";const SUGGESTIONS=["Rubuta ad don CV template","Create a Friday bundle deal post","Write TikTok caption for HARZ books","Create Instagram story text"];let msgs=[],busy=false,chats={},cur="default";function init(){try{const s=localStorage.getItem("chat_"+AGENT);if(s)chats=JSON.parse(s)}catch(e){}try{const t=localStorage.getItem("theme_"+AGENT);if(t)document.body.setAttribute("data-theme",t);document.getElementById("tb").innerHTML=t==="light"?"&#9728;":"&#9790;"}catch(e){}if(chats["default"]&&chats["default"].length>0){msgs=chats["default"];render()}else{showWelcome()}renderList()}function save(){try{localStorage.setItem("chat_"+AGENT,JSON.stringify(chats))}catch(e){}}function toggleSb(){document.getElementById("sb").classList.toggle("open");document.getElementById("ov").classList.toggle("show")}function toggleTheme(){const c=document.body.getAttribute("data-theme");const n=c==="dark"?"light":"dark";document.body.setAttribute("data-theme",n);localStorage.setItem("theme_"+AGENT,n);document.getElementById("tb").innerHTML=n==="dark"?"&#9790;":"&#9728;"}function newChat(){const id="c"+Date.now();cur=id;msgs=[];document.getElementById("ca").innerHTML="";showWelcome();document.getElementById("sb").classList.remove("open");document.getElementById("ov").classList.remove("show");renderList();save()}function showWelcome(){document.getElementById("ca").innerHTML='<div class="welcome"><div class="emoji">📢</div><h2>Balaraba</h2><div class="sub">Marketing &amp; Content</div><p style="font-size:12px;color:var(--text-dim);margin-bottom:16px">Ads, posts, promos — English, Hausa, Pidgin</p><div class="chips">'+SUGGESTIONS.map(s=>'<div class="chip" onclick="suggest(this.textContent)">'+s+'</div>').join("")+'</div></div>'}function renderList(){const l=document.getElementById("cl");l.innerHTML="";Object.keys(chats).reverse().forEach(id=>{if(!chats[id]||chats[id].length===0)return;const d=document.createElement("div");d.className="chat-item";d.textContent=chats[id][0].content.substring(0,28);d.onclick=()=>loadChat(id);l.appendChild(d)})}function loadChat(id){cur=id;msgs=chats[id]||[];render();toggleSb()}function render(){const e=document.getElementById("ca");e.innerHTML="";if(msgs.length===0){showWelcome();return}msgs.forEach(m=>addMsg(m.role,m.content));e.scrollTop=e.scrollHeight}function addMsg(role,content){const w=document.getElementById("wlc");if(w)w.remove();const e=document.getElementById("ca");const d=document.createElement("div");d.className="msg "+(role==="user"?"user":"ai");const r=document.createElement("div");r.className="msg-role";r.textContent=role==="user"?"You":NAME;const c=document.createElement("div");c.textContent=content;d.appendChild(r);d.appendChild(c);e.appendChild(d);e.scrollTop=e.scrollHeight;return d}function suggest(t){document.getElementById("inp").value=t;send()}function ping(){fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"user",content:"ping"}],agent:AGENT,model:"anthropic/claude-3-haiku"}),signal:AbortSignal.timeout(15000)}).then(r=>{document.getElementById("dot").className=r.ok?"status-dot":"status-dot red"}).catch(()=>{document.getElementById("dot").className="status-dot red"})}ping();setInterval(ping,60000);async function send(){const inp=document.getElementById("inp");const text=inp.value.trim();if(!text||busy)return;inp.value="";inp.style.height="auto";busy=true;document.getElementById("send").disabled=true;msgs.push({role:"user",content:text});addMsg("user",text);if(!chats[cur])chats[cur]=[];chats[cur]=msgs;save();renderList();const ca=document.getElementById("ca");const td=document.createElement("div");td.className="msg ai";td.id="ti";td.innerHTML='<div class="msg-role">'+NAME+'</div><div class="typing"><span></span><span></span><span></span></div>';ca.appendChild(td);ca.scrollTop=ca.scrollHeight;try{const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),90000);const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs.slice(-10),agent:AGENT}),signal:ctrl.signal});clearTimeout(to);document.getElementById("ti")?.remove();if(!res.ok){addMsg("assistant","Server error. Try again.")}else{const data=await res.json();const content=data.content||"No response";msgs.push({role:"assistant",content});addMsg("assistant",content);chats[cur]=msgs;save();renderList()}}catch(e){document.getElementById("ti")?.remove();const ed=addMsg("assistant",e.name==="AbortError"?"Request timed out.":"Network error.");const btn=document.createElement("button");btn.className="retry-btn";btn.textContent="Retry";btn.onclick=()=>{msgs.pop();msgs.pop();ed.remove();document.getElementById("inp").value=text;send()};ed.appendChild(document.createElement("br"));ed.appendChild(btn)}busy=false;document.getElementById("send").disabled=false;document.getElementById("inp").focus()}const inp=document.getElementById("inp");inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,100)+"px"});inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});init();</script>
</body></html>

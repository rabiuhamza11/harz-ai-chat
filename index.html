<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>HARZ AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0f0f1a; --surface:#1a1a2e; --surface2:#16213e;
  --border:#2a2a4a; --text:#e4e4ef; --text-dim:#8888a4;
  --accent:#6c63ff; --user-bg:#6c63ff; --ai-bg:#1e1e36;
  --green:#00d4a0; --radius:14px;
}
[data-theme="light"] {
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#f0f0f5;
  --border:#e0e0e8; --text:#1a1a2e; --text-dim:#666680; --ai-bg:#f0f0f5;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.header .menu-btn { background:none; border:none; color:var(--text-dim); cursor:pointer; padding:6px; font-size:18px; border-radius:8px; }
.header .menu-btn:active { background:var(--surface2); }
.header .logo { font-size:20px; }
.header .name { font-weight:700; font-size:15px; }
.model-sel { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:4px 6px; font-size:11px; cursor:pointer; outline:none; max-width:120px; }
.spacer { flex:1; }
.icon-btn { background:none; border:none; color:var(--text-dim); cursor:pointer; padding:6px; border-radius:8px; font-size:16px; }
.icon-btn:active { background:var(--surface2); }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0; }
.status-dot.red { background:#ff4444; }

.chat-area { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
.msg { max-width:88%; padding:10px 14px; border-radius:var(--radius); font-size:15px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self:flex-end; background:var(--user-bg); color:#fff; border-bottom-right-radius:4px; }
.msg.ai { align-self:flex-start; background:var(--ai-bg); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg-role { font-size:10px; color:var(--text-dim); margin-bottom:3px; font-weight:600; letter-spacing:.5px; }
.msg.user .msg-role { color:rgba(255,255,255,.6); }
.msg-attachment { font-size:12px; color:var(--accent); margin-bottom:6px; padding:4px 8px; background:var(--surface2); border-radius:6px; }
.msg.user .msg-attachment { background:rgba(255,255,255,.15); color:rgba(255,255,255,.8); }

.welcome { text-align:center; padding:30px 16px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.welcome .big-emoji { font-size:48px; margin-bottom:12px; }
.welcome h2 { font-size:20px; margin-bottom:4px; }
.welcome .sub { font-size:13px; color:var(--accent); margin-bottom:16px; }
.welcome p { font-size:12px; color:var(--text-dim); margin-bottom:16px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.chip { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer; }
.chip:active { background:var(--accent); color:#fff; border-color:var(--accent); }

.typing { display:inline-flex; gap:5px; padding:2px 0; }
.typing span { width:8px; height:8px; border-radius:50%; background:var(--text-dim); animation:bounce 1.2s infinite; }
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

.input-area { background:var(--surface); border-top:1px solid var(--border); padding:10px 12px; display:flex; gap:8px; align-items:flex-end; flex-shrink:0; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); }
.input-wrap { flex:1; background:var(--surface2); border:1.5px solid var(--border); border-radius:22px; display:flex; align-items:flex-end; padding:6px 6px 6px 14px; }
.input-wrap:focus-within { border-color:var(--accent); }
#inp { flex:1; background:none; border:none; color:var(--text); font-size:15px; font-family:inherit; resize:none; outline:none; max-height:100px; min-height:22px; padding:4px 0; line-height:1.4; }
#inp::placeholder { color:var(--text-dim); }
#attach { background:none; border:none; color:var(--text-dim); cursor:pointer; padding:4px; font-size:20px; flex-shrink:0; }
#attach:active { color:var(--accent); }
#send { background:var(--accent); color:#fff; border:none; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
#send:disabled { opacity:.35; }

.retry-btn { background:var(--accent); color:#fff; border:none; padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; margin-top:6px; }

/* File preview */
.file-preview { display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin-bottom:6px; max-width:260px; }
.file-preview .fp-icon { font-size:24px; flex-shrink:0; }
.file-preview .fp-info { flex:1; min-width:0; }
.file-preview .fp-name { font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file-preview .fp-size { font-size:10px; color:var(--text-dim); }
.file-preview .fp-remove { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:18px; padding:2px; flex-shrink:0; }
.file-preview .fp-remove:active { color:#ff4444; }
.file-preview img { width:40px; height:40px; border-radius:6px; object-fit:cover; flex-shrink:0; }

#fileInput { display:none; }

.sidebar { position:fixed; top:0; left:0; width:240px; height:100dvh; background:var(--surface); border-right:1px solid var(--border); transform:translateX(-100%); transition:transform .3s ease; z-index:100; display:flex; flex-direction:column; }
.sidebar.open { transform:translateX(0); }
.sidebar-h { padding:14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.sidebar-h h3 { color:var(--accent); font-size:16px; }
.new-chat { background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:10px; font-size:14px; cursor:pointer; margin:12px; font-weight:600; }
.new-chat:active { background:#4a42d4; }
.chat-list { flex:1; overflow-y:auto; padding:0 12px; }
.chat-item { padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-dim); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-item:active { background:var(--surface2); color:var(--text); }
.agents-link { padding:12px; border-top:1px solid var(--border); font-size:12px; color:var(--text-dim); }
.agents-link a { color:var(--accent); text-decoration:none; display:block; padding:4px 0; }
.overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:99; opacity:0; pointer-events:none; transition:opacity .3s; }
.overlay.show { opacity:1; pointer-events:auto; }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Voice recording */
.voice-btn { background:none; border:none; color:var(--text-dim); cursor:pointer; padding:4px; font-size:20px; flex-shrink:0; }
.voice-btn.recording { color:#ff4444; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.voice-lang { background:var(--surface2); color:var(--text-dim); border:1px solid var(--border); border-radius:6px; padding:2px 4px; font-size:10px; cursor:pointer; outline:none; max-width:70px; }
.recording-indicator { position:fixed; top:60px; left:50%; transform:translateX(-50%); background:#ff4444; color:#fff; padding:6px 16px; border-radius:20px; font-size:13px; z-index:200; display:none; animation:fadeIn .2s; }
.recording-indicator.show { display:block; }
</style>
</head>
<body data-theme="dark">
<div class="sidebar" id="sb">
  <div class="sidebar-h"><h3>HARZ AI</h3><button class="icon-btn" onclick="toggleSb()">&times;</button></div>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
  <div class="chat-list" id="cl"></div>
  <div class="agents-link">HARZ AI Agents:<br><a href="hauwa.html">Hauwa - Marketing</a><a href="rabi.html">Rabi - Finance</a><a href="nuruddeen.html">Nuruddeen - Knowledge</a><a href="hamza.html">Hamza - Code</a><a href="aisha.html">Aisha - Support</a><a href="talle.html">Talle - Market</a></div>
  <a href="video-creator.html" style="display:block;padding:10px 12px;color:var(--accent);text-decoration:none;font-size:13px;border-top:1px solid var(--border)">🎬 Video Creator</a>
  <div style="padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim)">Powered by Claude Sonnet 5 + Qwen<br>HARZ Digital Services</div>
</div>
<div class="overlay" id="ov" onclick="toggleSb()"></div>

<div class="header">
  <button class="menu-btn" onclick="toggleSb()">&#9776;</button>
  <span class="logo">🤖</span>
  <span class="name">HARZ AI</span>
  <select class="model-sel" id="mdl">
    <option value="">Claude Sonnet 5</option>
    <option value="anthropic/claude-3-haiku">Claude Haiku</option>
    <option value="qwen/qwen3.7-flash">Qwen Flash</option>
    <option value="qwen/qwen3.7-plus">Qwen Plus</option>
    <option value="deepseek/deepseek-v4-flash-latest">DeepSeek</option>
    <option value="openai/gpt-oss-20b:free">GPT-OSS (Free)</option>
    <option value="gpt-5">GPT-5</option>
    <option value="gpt-4o">GPT-4o</option>
    <option value="gpt-4o-mini">GPT-4o Mini</option>
    <option value="o3">o3 Reasoning</option>
    <option value="o4-mini">o4 Mini</option>
  </select>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="toggleTheme()" id="tb">&#9790;</button>
  <div class="status-dot" id="dot"></div>
</div>

<div class="recording-indicator" id="recIndicator">🔴 Recording... Tap mic to stop</div>
<div class="chat-area" id="ca">
  <div class="welcome" id="wlc"></div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <input type="file" id="fileInput" accept=".pdf,image/*,video/*,audio/*">
    <select class="voice-lang" id="voiceLang"><option value="en-NG">Eng</option><option value="ha-NG">Hau</option><option value="en-US">US</option></select>
    <button class="voice-btn" id="micBtn" onclick="toggleVoice()">&#127908;</button>
    <button id="attach" onclick="document.getElementById('fileInput').click()">&#128206;</button>
    <div id="filePreviewArea"></div>
    <textarea id="inp" placeholder="Type a message..." rows="1"></textarea>
    <button id="send" onclick="send()">&#8593;</button>
  </div>
</div>

<script>
const API = "https://superagent-2286fb2f.base44.app/functions/harzChat";
const AGENT = "harz-ai";
const NAME = "HARZ AI";
const SUGGESTIONS = ["Sannu! Taimaka ni da business plan", "Write a promo post for my store", "Fassara zuwa Hausa: Welcome to HARZ", "Code a simple HTML form"];

let msgs = [], busy = false, chats = {}, cur = "default";
let attachedFile = null;
let attachedFileBase64 = null;
let attachedFileType = null;


// Voice Recording (Web Speech API)
let recognition = null, isRecording = false;
let voiceTranscript = "";

function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById("micBtn").style.display = "none";
    document.getElementById("voiceLang").style.display = "none";
    return;
  }
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  
  recognition.onresult = function(event) {
    let interim = "";
    let final = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += t;
      else interim += t;
    }
    if (final) voiceTranscript += final + " ";
    const inp = document.getElementById("inp");
    inp.value = voiceTranscript + interim;
    inp.style.height = "auto";
    inp.style.height = Math.min(inp.scrollHeight, 100) + "px";
  };
  
  recognition.onerror = function(event) {
    console.log("Voice error:", event.error);
    if (event.error === "no-speech") return;
    if (event.error === "not-allowed") {
      alert("Ka bada izinin microphone a browser settings.");
    }
    stopVoice();
  };
  
  recognition.onend = function() {
    if (isRecording) {
      // Restart if still recording (Chrome stops after silence)
      try { recognition.start(); } catch(e) {}
    }
  };
}

function toggleVoice() {
  if (!recognition) { alert("Browser din ba ya goyon bayan voice. Yi amfani da Chrome."); return; }
  if (isRecording) stopVoice();
  else startVoice();
}

function startVoice() {
  const lang = document.getElementById("voiceLang").value || "en-NG";
  recognition.lang = lang;
  voiceTranscript = document.getElementById("inp").value || "";
  isRecording = true;
  document.getElementById("micBtn").classList.add("recording");
  document.getElementById("micBtn").innerHTML = "&#9209;";
  document.getElementById("recIndicator").classList.add("show");
  try { recognition.start(); } catch(e) {}
}

function stopVoice() {
  isRecording = false;
  try { recognition.stop(); } catch(e) {}
  document.getElementById("micBtn").classList.remove("recording");
  document.getElementById("micBtn").innerHTML = "&#127908;";
  document.getElementById("recIndicator").classList.remove("show");
}

function init() {
  try { const s = localStorage.getItem("chat_harz-ai"); if (s) chats = JSON.parse(s); } catch(e) {}
  try { const t = localStorage.getItem("theme_harz-ai"); if (t) document.body.setAttribute("data-theme", t); document.getElementById("tb").innerHTML = t==="light"?"&#9728;":"&#9790;"; } catch(e) {}
  if (chats["default"] && chats["default"].length > 0) { msgs = chats["default"]; render(); } else { showWelcome(); }
  renderList();

  initVoice();
  // File upload handler
  document.getElementById("fileInput").addEventListener("change", handleFile);
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  // Check file size (max 10MB)
  if (file.size > 10 * 1024 * 1024) {
    alert("File ya kai 10MB. Sai ka rage shi.");
    e.target.value = "";
    return;
  }
  
  attachedFile = file;
  const reader = new FileReader();
  
  if (file.type.startsWith("image/")) {
    attachedFileType = "image";
    reader.onload = function(ev) {
      attachedFileBase64 = ev.target.result;
      showFilePreview(file, ev.target.result);
    };
    reader.readAsDataURL(file);
  } else if (file.type === "application/pdf" || file.name.endsWith(".pdf")) {
    attachedFileType = "pdf";
    reader.onload = function(ev) {
      attachedFileBase64 = ev.target.result;
      showFilePreview(file, null);
    };
    reader.readAsDataURL(file);
  } else if (file.type.startsWith("video/")) {
    attachedFileType = "video";
    reader.onload = function(ev) {
      attachedFileBase64 = ev.target.result;
      showFilePreview(file, null);
    };
    reader.readAsDataURL(file);
  } else if (file.type.startsWith("audio/")) {
    attachedFileType = "audio";
    reader.onload = function(ev) {
      attachedFileBase64 = ev.target.result;
      showFilePreview(file, null);
    };
    reader.readAsDataURL(file);
  } else {
    alert("Type din da aka tallaka: PDF, Image, Video, ko Audio kawai.");
    e.target.value = "";
  }
}

function showFilePreview(file, imgUrl) {
  const area = document.getElementById("filePreviewArea");
  let icon = "&#128196;";
  if (attachedFileType === "image") icon = imgUrl ? "" : "&#128247;";
  else if (attachedFileType === "pdf") icon = "&#128209;";
  else if (attachedFileType === "video") icon = "&#127909;";
  else if (attachedFileType === "audio") icon = "&#127908;";
  
  const sizeStr = file.size > 1024*1024 ? (file.size/1024/1024).toFixed(1)+"MB" : Math.round(file.size/1024)+"KB";
  
  area.innerHTML = '<div class="file-preview">' +
    (imgUrl ? '<img src="'+imgUrl+'">' : '<span class="fp-icon">'+icon+'</span>') +
    '<div class="fp-info"><div class="fp-name">'+file.name+'</div><div class="fp-size">'+sizeStr+'</div></div>' +
    '<button class="fp-remove" onclick="removeFile()">&times;</button>' +
    '</div>';
}

function removeFile() {
  attachedFile = null;
  attachedFileBase64 = null;
  attachedFileType = null;
  document.getElementById("filePreviewArea").innerHTML = "";
  document.getElementById("fileInput").value = "";
}

function save() { try { localStorage.setItem("chat_harz-ai", JSON.stringify(chats)); } catch(e) {} }
function toggleSb() { document.getElementById("sb").classList.toggle("open"); document.getElementById("ov").classList.toggle("show"); }
function toggleTheme() {
  const c = document.body.getAttribute("data-theme"); const n = c==="dark"?"light":"dark";
  document.body.setAttribute("data-theme", n); localStorage.setItem("theme_harz-ai", n);
  document.getElementById("tb").innerHTML = n==="dark"?"&#9790;":"&#9728;";
}
function newChat() {
  const id = "c" + Date.now(); cur = id; msgs = [];
  document.getElementById("ca").innerHTML = ""; showWelcome();
  document.getElementById("sb").classList.remove("open"); document.getElementById("ov").classList.remove("show");
  renderList(); save();
}
function showWelcome() {
  document.getElementById("ca").innerHTML = '<div class="welcome"><div class="big-emoji">🤖</div><h2>HARZ AI</h2><div class="sub">General Assistant</div><p>Claude Sonnet 5 | Qwen | GPT-5 | Voice | PDF | Image</p><div class="chips">' + SUGGESTIONS.map(s => '<div class="chip" onclick="useSug(this)">'+s+'</div>').join('') + '</div></div>';
}
function useSug(el) { document.getElementById("inp").value = el.textContent; document.getElementById("inp").focus(); }
function renderList() {
  const list = document.getElementById("cl");
  list.innerHTML = Object.keys(chats).map(id => {
    const m = chats[id]; if (!m || m.length === 0) return "";
    const txt = m[0].content.substring(0, 30);
    return '<div class="chat-item" onclick="loadChat(\''+id+'\')">'+txt+'...</div>';
  }).join("");
}
function loadChat(id) { cur = id; msgs = chats[id] || []; render(); document.getElementById("sb").classList.remove("open"); document.getElementById("ov").classList.remove("show"); }
function render() {
  const ca = document.getElementById("ca"); ca.innerHTML = "";
  for (const m of msgs) {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    let html = "";
    if (m.attachment) html += '<div class="msg-attachment">'+m.attachment+'</div>';
    if (m.role === "user") html += '<div class="msg-role">You</div>';
    else html += '<div class="msg-role">'+(m.agent_name||NAME)+'</div>';
    html += '<div>' + escapeHtml(m.content) + '</div>';
    div.innerHTML = html; ca.appendChild(div);
  }
  ca.scrollTop = ca.scrollHeight;
}
function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

async function send() {
  const inp = document.getElementById("inp");
  const text = inp.value.trim();
  if ((!text && !attachedFile) || busy) return;
  
  busy = true;
  document.getElementById("send").disabled = true;
  
  let userMsg = { role: "user", content: text || "(File upload)" };
  if (attachedFile) {
    userMsg.attachment = "&#128206; " + attachedFile.name + " (" + attachedFileType + ")";
  }
  msgs.push(userMsg);
  inp.value = "";
  render();
  
  // Build request payload
  const payload = { messages: msgs.map(m => ({ role: m.role, content: m.content })), agent: AGENT };
  const model = document.getElementById("mdl").value;
  if (model) payload.model = model;
  
  // Attach file if present
  if (attachedFile && attachedFileBase64) {
    payload.file = {
      name: attachedFile.name,
      type: attachedFileType,
      mime: attachedFile.type,
      data: attachedFileBase64
    };
  }
  
  // Remove file preview
  removeFile();
  
  // Show typing
  const ca = document.getElementById("ca");
  const typingDiv = document.createElement("div");
  typingDiv.className = "msg ai";
  typingDiv.innerHTML = '<div class="msg-role">'+NAME+'</div><div class="typing"><span></span><span></span><span></span></div>';
  ca.appendChild(typingDiv);
  ca.scrollTop = ca.scrollHeight;
  
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    typingDiv.remove();
    if (data.error) {
      msgs.push({ role: "assistant", content: "Kuskure: " + data.error + (data.details ? "\n" + data.details.substring(0,100) : ""), agent_name: NAME });
    } else {
      msgs.push({ role: "assistant", content: data.content, agent_name: data.agent_name || NAME, model: data.model });
    }
    render();
    chats[cur] = msgs; save(); renderList();
  } catch(err) {
    typingDiv.remove();
    msgs.push({ role: "assistant", content: "Ba zan iya kaiwa ba. Ka gwada again.\n" + err.message, agent_name: NAME });
    render();
    chats[cur] = msgs; save();
  }
  
  busy = false;
  document.getElementById("send").disabled = false;
  inp.focus();
}

// Enter to send
document.getElementById("inp").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
// Auto-resize textarea
document.getElementById("inp").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 100) + "px";
});

init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>HARZ AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#0f0f1a; --surface:#1a1a2e; --surface2:#16213e;
  --border:#2a2a4a; --text:#e4e4ef; --text-dim:#8888a4;
  --accent:#6c63ff; --user-bg:#6c63ff; --ai-bg:#1e1e36;
  --green:#00d4a0; --radius:14px;
}
[data-theme="light"] {
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#f0f0f5;
  --border:#e0e0e8; --text:#1a1a2e; --text-dim:#666680; --ai-bg:#f0f0f5;
}
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.header .menu-btn { background:none; border:none; color:var(--text-dim); cursor:pointer; padding:6px; font-size:18px; border-radius:8px; }
.header .menu-btn:active { background:var(--surface2); }
.agent-info { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.agent-avatar { font-size:22px; flex-shrink:0; }
.agent-name { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.agent-title { font-size:11px; color:var(--text-dim); white-space:nowrap; }
.model-sel { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:4px 6px; font-size:11px; cursor:pointer; outline:none; max-width:100px; }
.spacer { flex:1; }
.icon-btn { background:none; border:none; color:var(--text-dim); cursor:pointer; padding:6px; border-radius:8px; font-size:16px; }
.icon-btn:active { background:var(--surface2); }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); flex-shrink:0; }
.status-dot.red { background:#ff4444; }

/* Agent selector bar */
.agent-bar { display:flex; gap:6px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; flex-shrink:0; scrollbar-width:none; }
.agent-bar::-webkit-scrollbar { display:none; }
.agent-chip { display:flex; align-items:center; gap:4px; padding:6px 12px; border-radius:20px; background:var(--surface2); border:1px solid var(--border); cursor:pointer; font-size:12px; color:var(--text-dim); white-space:nowrap; flex-shrink:0; }
.agent-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.agent-chip .e { font-size:14px; }

.chat-area { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
.msg { max-width:88%; padding:10px 14px; border-radius:var(--radius); font-size:15px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; animation:fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self:flex-end; background:var(--user-bg); color:#fff; border-bottom-right-radius:4px; }
.msg.ai { align-self:flex-start; background:var(--ai-bg); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg-role { font-size:10px; color:var(--text-dim); margin-bottom:3px; font-weight:600; letter-spacing:.5px; }
.msg.user .msg-role { color:rgba(255,255,255,.6); }

.welcome { text-align:center; padding:30px 16px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.welcome .big-emoji { font-size:48px; margin-bottom:12px; }
.welcome h2 { font-size:20px; margin-bottom:4px; }
.welcome .sub { font-size:13px; color:var(--accent); margin-bottom:16px; }
.welcome p { font-size:12px; color:var(--text-dim); margin-bottom:16px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.chip { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer; }
.chip:active { background:var(--accent); color:#fff; border-color:var(--accent); }

.typing { display:inline-flex; gap:5px; padding:2px 0; }
.typing span { width:8px; height:8px; border-radius:50%; background:var(--text-dim); animation:bounce 1.2s infinite; }
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

.input-area { background:var(--surface); border-top:1px solid var(--border); padding:10px 12px; display:flex; gap:8px; align-items:flex-end; flex-shrink:0; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); }
.input-wrap { flex:1; background:var(--surface2); border:1.5px solid var(--border); border-radius:22px; display:flex; align-items:flex-end; padding:6px 6px 6px 14px; }
.input-wrap:focus-within { border-color:var(--accent); }
#inp { flex:1; background:none; border:none; color:var(--text); font-size:15px; font-family:inherit; resize:none; outline:none; max-height:100px; min-height:22px; padding:4px 0; line-height:1.4; }
#inp::placeholder { color:var(--text-dim); }
#send { background:var(--accent); color:#fff; border:none; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
#send:disabled { opacity:.35; }

.retry-btn { background:var(--accent); color:#fff; border:none; padding:6px 14px; border-radius:8px; font-size:13px; cursor:pointer; margin-top:6px; }

.sidebar { position:fixed; top:0; left:0; width:240px; height:100dvh; background:var(--surface); border-right:1px solid var(--border); transform:translateX(-100%); transition:transform .3s ease; z-index:100; display:flex; flex-direction:column; }
.sidebar.open { transform:translateX(0); }
.sidebar-h { padding:14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.sidebar-h h3 { color:var(--accent); font-size:16px; }
.new-chat { background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:10px; font-size:14px; cursor:pointer; margin:12px; font-weight:600; }
.new-chat:active { background:#4a42d4; }
.chat-list { flex:1; overflow-y:auto; padding:0 12px; }
.chat-item { padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text-dim); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chat-item:active { background:var(--surface2); color:var(--text); }
.overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:99; opacity:0; pointer-events:none; transition:opacity .3s; }
.overlay.show { opacity:1; pointer-events:auto; }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body data-theme="dark">
<div class="sidebar" id="sb">
  <div class="sidebar-h"><h3>HARZ AI</h3><button class="icon-btn" onclick="toggleSb()">&times;</button></div>
  <button class="new-chat" onclick="newChat()">+ New Chat</button>
  <div class="chat-list" id="cl"></div>
  <div style="padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim)">Powered by Claude Sonnet 5<br>HARZ Digital Services</div>
</div>
<div class="overlay" id="ov" onclick="toggleSb()"></div>

<div class="header">
  <button class="menu-btn" onclick="toggleSb()">&#9776;</button>
  <div class="agent-info">
    <span class="agent-avatar" id="av">🤖</span>
    <div>
      <div class="agent-name" id="an">HARZ AI</div>
      <div class="agent-title" id="at">General Assistant</div>
    </div>
  </div>
  <select class="model-sel" id="mdl">
    <option value="">Claude Sonnet</option>
    <option value="anthropic/claude-3-haiku">Claude Haiku</option>
    <option value="qwen/qwen3.7-flash">Qwen Flash</option>
    <option value="qwen/qwen3.7-plus">Qwen Plus</option>
    <option value="deepseek/deepseek-v4-flash-latest">DeepSeek</option>
    <option value="openai/gpt-oss-20b:free">GPT-OSS</option>
  </select>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="toggleTheme()" id="tb">&#9790;</button>
  <div class="status-dot" id="dot"></div>
</div>

<div class="agent-bar" id="ab"></div>

<div class="chat-area" id="ca">
  <div class="welcome" id="wlc"></div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="inp" placeholder="Type a message..." rows="1"></textarea>
    <button id="send" onclick="send()">&#8593;</button>
  </div>
</div>

<script>
const API = "https://superagent-2286fb2f.base44.app/functions/harzChat";

const AGENTS = {
  "harz-ai": { name:"HARZ AI", title:"General Assistant", emoji:"🤖",
    suggestions: ["Sannu! Taimaka ni da business plan", "Write a promo post for my store", "Fassara zuwa Hausa: Welcome to HARZ", "Code a simple HTML form"] },
  "sani": { name:"Sani", title:"Knowledge & Research", emoji:"📚",
    suggestions: ["Wadanne products kuke da su?", "What are the 10 HARZ platforms?", "Tell me about GDEG Token", "Wadanne hanyoyin biya kuke da su?"] },
  "balaraba": { name:"Balaraba", title:"Marketing & Content", emoji:"📢",
    suggestions: ["Rubuta ad don CV template", "Create a Friday bundle deal post", "Write TikTok caption for HARZ books", "Create Instagram story text"] },
  "danladi": { name:"Danladi", title:"Finance & Orders", emoji:"💰",
    suggestions: ["What is today's revenue?", "How many orders this week?", "Calculate GDEG to Naira", "Generate daily revenue report"] },
  "zainab": { name:"Zainab", title:"Customer Support", emoji:"🎧",
    suggestions: ["Customer asks: How much is the bundle?", "A customer wants a refund", "Someone asked about Paystack payment", "Reply to: How do I buy with crypto?"] },
  "umar": { name:"Umar", title:"Code & Tech", emoji:"⚡",
    suggestions: ["Code a payment form in HTML", "How to integrate Paystack?", "Debug my JavaScript code", "Create a WhatsApp bot setup"] },
};

let curAgent = "harz-ai";
let msgs = [], busy = false, chats = {}, cur = "default";

function init() {
  try { const s = localStorage.getItem("harz_chats"); if (s) chats = JSON.parse(s); } catch(e) {}
  try { const t = localStorage.getItem("harz_theme"); if (t) document.body.setAttribute("data-theme", t); document.getElementById("tb").innerHTML = t==="light"?"&#9728;":"&#9790;"; } catch(e) {}

  // Build agent bar
  const ab = document.getElementById("ab");
  Object.entries(AGENTS).forEach(([id, a]) => {
    const c = document.createElement("div");
    c.className = "agent-chip" + (id === curAgent ? " active" : "");
    c.id = "chip-" + id;
    c.innerHTML = '<span class="e">' + a.emoji + '</span>' + a.name;
    c.onclick = () => switchAgent(id);
    ab.appendChild(c);
  });

  if (chats["default"] && chats["default"].length > 0) {
    cur = Object.keys(chats)[0]; msgs = chats[cur] || []; render();
  } else { showWelcome(); }
  renderList();
}

function save() { try { localStorage.setItem("harz_chats", JSON.stringify(chats)); } catch(e) {} }
function toggleSb() { document.getElementById("sb").classList.toggle("open"); document.getElementById("ov").classList.toggle("show"); }
function toggleTheme() {
  const c = document.body.getAttribute("data-theme"); const n = c==="dark"?"light":"dark";
  document.body.setAttribute("data-theme", n); localStorage.setItem("harz_theme", n);
  document.getElementById("tb").innerHTML = n==="dark"?"&#9790;":"&#9728;";
}

function switchAgent(id) {
  curAgent = id;
  const a = AGENTS[id];
  document.getElementById("av").textContent = a.emoji;
  document.getElementById("an").textContent = a.name;
  document.getElementById("at").textContent = a.title;
  document.querySelectorAll(".agent-chip").forEach(c => c.classList.remove("active"));
  document.getElementById("chip-" + id).classList.add("active");
  msgs = []; cur = "default";
  if (chats["default_" + id]) { msgs = chats["default_" + id]; render(); }
  else { showWelcome(); }
  save();
}

function newChat() {
  const id = "c" + Date.now(); cur = id; msgs = [];
  document.getElementById("ca").innerHTML = ""; showWelcome();
  document.getElementById("sb").classList.remove("open"); document.getElementById("ov").classList.remove("show");
  renderList(); save();
}

function showWelcome() {
  const a = AGENTS[curAgent];
  document.getElementById("ca").innerHTML = '<div class="welcome" id="wlc">' +
    '<div class="big-emoji">' + a.emoji + '</div>' +
    '<h2>' + a.name + '</h2>' +
    '<div class="sub">' + a.title + '</div>' +
    '<p>Powered by Claude Sonnet 5 | English | Hausa | Pidgin</p>' +
    '<div class="chips">' +
    a.suggestions.map(s => '<div class="chip" onclick="suggest(this.textContent)">' + s + '</div>').join('') +
    '</div></div>';
}

function renderList() {
  const l = document.getElementById("cl"); l.innerHTML = "";
  Object.keys(chats).reverse().forEach(id => {
    const c = chats[id]; if (!c || c.length === 0) return;
    const f = c[0].content.substring(0,28);
    const d = document.createElement("div"); d.className = "chat-item"; d.textContent = f;
    d.onclick = () => loadChat(id); l.appendChild(d);
  });
}

function loadChat(id) { cur = id; msgs = chats[id] || []; render(); toggleSb(); }

function render() {
  const e = document.getElementById("ca"); e.innerHTML = "";
  if (msgs.length === 0) { showWelcome(); return; }
  msgs.forEach(m => { addMsg(m.role, m.content, m.agent); });
  e.scrollTop = e.scrollHeight;
}

function addMsg(role, content, agent) {
  const w = document.getElementById("wlc"); if (w) w.remove();
  const e = document.getElementById("ca"); const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "ai");
  let label = "You";
  if (role === "assistant") { label = agent ? AGENTS[agent]?.name || "HARZ AI" : "HARZ AI"; }
  const r = document.createElement("div"); r.className = "msg-role"; r.textContent = label;
  const c = document.createElement("div"); c.textContent = content;
  d.appendChild(r); d.appendChild(c); e.appendChild(d); e.scrollTop = e.scrollHeight;
  return d;
}

function suggest(t) { document.getElementById("inp").value = t; send(); }

function ping() {
  fetch(API, { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({messages:[{role:"user",content:"ping"}], agent:"harz-ai", model:"anthropic/claude-3-haiku"}),
    signal: AbortSignal.timeout(15000) })
  .then(r => { document.getElementById("dot").className = r.ok ? "status-dot" : "status-dot red"; })
  .catch(() => { document.getElementById("dot").className = "status-dot red"; });
}
ping(); setInterval(ping, 60000);

async function send() {
  const inp = document.getElementById("inp"); const text = inp.value.trim();
  if (!text || busy) return;
  inp.value = ""; inp.style.height = "auto"; busy = true; document.getElementById("send").disabled = true;

  const sentAgent = curAgent;
  msgs.push({ role:"user", content:text, agent:sentAgent });
  addMsg("user", text, sentAgent);
  if (!chats[cur]) chats[cur] = []; chats[cur] = msgs; save(); renderList();

  const ca = document.getElementById("ca"); const td = document.createElement("div");
  td.className = "msg ai"; td.id = "ti";
  const aName = AGENTS[sentAgent].name;
  td.innerHTML = '<div class="msg-role">' + aName + '</div><div class="typing"><span></span><span></span><span></span></div>';
  ca.appendChild(td); ca.scrollTop = ca.scrollHeight;

  const customModel = document.getElementById("mdl").value || undefined;
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 90000);
    const res = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ messages: msgs.slice(-10), agent: sentAgent, model: customModel }), signal: ctrl.signal });
    clearTimeout(to); document.getElementById("ti")?.remove();

    if (!res.ok) { addMsg("assistant", "Server error (" + res.status + "). Try again.", sentAgent); }
    else {
      const data = await res.json(); const content = data.content || "No response";
      msgs.push({ role:"assistant", content, agent:sentAgent });
      addMsg("assistant", content, sentAgent);
      chats[cur] = msgs; save(); renderList();
    }
  } catch(e) {
    document.getElementById("ti")?.remove();
    const ed = addMsg("assistant", e.name==="AbortError" ? "Request timed out. Try again or switch to WiFi." : "Network error. Check your connection.", sentAgent);
    const btn = document.createElement("button"); btn.className="retry-btn"; btn.textContent="Retry";
    btn.onclick = () => { msgs.pop(); msgs.pop(); ed.remove(); document.getElementById("inp").value=text; send(); };
    ed.appendChild(document.createElement("br")); ed.appendChild(btn);
  }
  busy = false; document.getElementById("send").disabled = false; document.getElementById("inp").focus();
}

const inp = document.getElementById("inp");
inp.addEventListener("input", () => { inp.style.height="auto"; inp.style.height=Math.min(inp.scrollHeight,100)+"px"; });
inp.addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>HARZ AI</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f0f1a; --surface: #1a1a2e; --surface2: #16213e;
  --border: #2a2a4a; --text: #e4e4ef; --text-dim: #8888a4;
  --accent: #6c63ff; --user-bg: #6c63ff; --ai-bg: #1e1e36;
  --green: #00d4a0; --radius: 14px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.logo { font-weight: 700; font-size: 18px; color: var(--accent); }
.logo span { color: var(--green); }
.model-sel { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 12px; cursor: pointer; outline: none; max-width: 120px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-left: auto; flex-shrink: 0; }
.status-dot.red { background: #ff4444; }
.chat-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: var(--radius); font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
.msg.user { align-self: flex-end; background: var(--user-bg); color: white; border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--ai-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg-role { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; font-weight: 600; letter-spacing: 0.5px; }
.msg.user .msg-role { color: rgba(255,255,255,0.6); }
.welcome { text-align: center; padding: 30px 16px; color: var(--text-dim); flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.welcome h2 { color: var(--text); font-size: 20px; margin-bottom: 6px; }
.welcome p { font-size: 13px; margin-bottom: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; }
.chip:active { background: var(--accent); color: white; border-color: var(--accent); }
.typing { display: inline-flex; gap: 5px; padding: 2px 0; }
.typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
.input-area { background: var(--surface); border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.input-wrap { flex: 1; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 22px; display: flex; align-items: flex-end; padding: 6px 6px 6px 14px; }
.input-wrap:focus-within { border-color: var(--accent); }
#inp { flex:1; background:none; border:none; color:var(--text); font-size:15px; font-family:inherit; resize:none; outline:none; max-height:100px; min-height:22px; padding: 4px 0; line-height:1.4; }
#inp::placeholder { color: var(--text-dim); }
#send { background: var(--accent); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#send:disabled { opacity: 0.35; }
.retry-btn { background: var(--accent); color: white; border: none; padding: 6px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; margin-top: 6px; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">HARZ <span>AI</span></div>
  <select class="model-sel" id="mdl">
    <option value="qwen-flash">Qwen Flash ⚡</option>
    <option value="qwen-plus">Qwen Plus</option>
    <option value="qwen-max">Qwen Max</option>
    <option value="qwen-coder">Qwen Coder</option>
    <option value="deepseek">DeepSeek V4</option>
    <option value="gpt-oss">GPT-OSS (Free)</option>
  </select>
  <div class="status-dot" id="dot"></div>
</div>
<div class="chat-area" id="ca">
  <div class="welcome" id="wlc">
    <h2>HARZ AI Chat</h2>
    <p>English • Hausa • Pidgin</p>
    <div class="chips">
      <div class="chip" onclick="suggest('Sannu! Taimaka ni da business plan')">Business plan (Hausa)</div>
      <div class="chip" onclick="suggest('Write a promo post for my digital store')">Promo post</div>
      <div class="chip" onclick="suggest('Fassara zuwa Hausa: Welcome to HARZ')">Fassara</div>
      <div class="chip" onclick="suggest('Code a simple payment form in HTML')">Code</div>
    </div>
  </div>
</div>
<div class="input-area">
  <div class="input-wrap">
    <textarea id="inp" placeholder="Type a message..." rows="1"></textarea>
    <button id="send" onclick="send()">↑</button>
  </div>
</div>

<script>
const API = "https://superagent-2286fb2f.base44.app/functions/harzChat";
let msgs = [], busy = false;

function ping() {
  fetch(API, { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({messages:[{role:"user",content:"ping"}], model:"qwen-flash"}),
    signal: AbortSignal.timeout(15000)
  }).then(r => {
    document.getElementById("dot").className = r.ok ? "status-dot" : "status-dot red";
  }).catch(() => { document.getElementById("dot").className = "status-dot red"; });
}
ping();

function suggest(t) { document.getElementById("inp").value=t; send(); }

function addMsg(role, content) {
  const wlc = document.getElementById("wlc");
  if (wlc) wlc.remove();
  const ca = document.getElementById("ca");
  const d = document.createElement("div");
  d.className = "msg " + (role==="user" ? "user" : "ai");
  d.innerHTML = `<div class="msg-role">${role==="user"?"You":"HARZ AI"}</div>${esc(content)}`;
  ca.appendChild(d);
  ca.scrollTop = ca.scrollHeight;
  return d;
}

function esc(t) {
  const d = document.createElement("div"); d.textContent=t; return d.innerHTML;
}

async function send() {
  const inp = document.getElementById("inp");
  const text = inp.value.trim();
  if (!text || busy) return;
  inp.value = ""; inp.style.height = "auto";
  busy = true;
  document.getElementById("send").disabled = true;

  msgs.push({role:"user", content:text});
  addMsg("user", text);

  const ca = document.getElementById("ca");
  const td = document.createElement("div");
  td.className = "msg ai"; td.id = "ti";
  td.innerHTML = '<div class="msg-role">HARZ AI</div><div class="typing"><span></span><span></span><span></span></div>';
  ca.appendChild(td); ca.scrollTop = ca.scrollHeight;

  const model = document.getElementById("mdl").value;
  // Keep only last 10 messages to reduce payload and speed up 3G
  const recentMsgs = msgs.slice(-10);

  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 60000); // 60s timeout for 3G

    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({messages: recentMsgs, model}),
      signal: ctrl.signal
    });
    clearTimeout(timeout);

    document.getElementById("ti")?.remove();

    if (!res.ok) {
      const err = await res.text();
      addMsg("assistant", "Server error (" + res.status + "). Try again.");
    } else {
      const data = await res.json();
      const content = data.content || "No response";
      msgs.push({role:"assistant", content});
      addMsg("assistant", content);
    }
  } catch(e) {
    document.getElementById("ti")?.remove();
    const errDiv = addMsg("assistant", e.name === "AbortError"
      ? "Request timed out on slow network. Try again or switch to WiFi."
      : "Network error. Check your connection and try again.");
    const btn = document.createElement("button");
    btn.className = "retry-btn"; btn.textContent = "Retry";
    btn.onclick = () => {
      msgs.pop(); msgs.pop();
      errDiv.remove();
      inp.value = text; send();
    };
    errDiv.appendChild(document.createElement("br"));
    errDiv.appendChild(btn);
  }

  busy = false;
  document.getElementById("send").disabled = false;
  inp.focus();
}

const inp = document.getElementById("inp");
inp.addEventListener("input", () => {
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 100) + "px";
});
inp.addEventListener("keydown", e => {
  if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
